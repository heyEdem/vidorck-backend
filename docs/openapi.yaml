              differenceMinor: {type: integer}
              settlementMethod: {type: string, enum: [NONE, CASH, MOMO, BANK, OTHER]}
              settlementNote: {type: string, nullable: true}
              createdAt: {type: string, format: date-time}
    AdminOrderNote:
      type: object
      required: [id, body, staffId, staffName, createdAt]
      properties:
        id: {type: integer}
        body: {type: string}
        staffId: {type: integer, nullable: true}
        staffName: {type: string}
        createdAt: {type: string, format: date-time}
    AdminOrder:
      type: object
      description: List responses omit items, statusEvents, notes, and contentRevisions.
      required: [orderNumber, status, allowedStatuses, source, totalPaidMinor, subtotalMinor, currency, paymentMethod, paymentReference, paidAt, createdAt, customer, delivery, deliveryFeeNote, createdByStaffId]
      properties:
        orderNumber: {type: string}
        status: {$ref: '#/components/schemas/OrderStatus'}
        allowedStatuses:
          type: array
          description: Statuses the calling staff member may move this order to (corrections included for Admin).
          items: {$ref: '#/components/schemas/OrderStatus'}
        source: {type: string, enum: [ONLINE, MANUAL]}
        totalPaidMinor: {type: integer}
        subtotalMinor: {type: integer}
        currency: {type: string, enum: [GHS]}
        paymentMethod: {type: string, nullable: true}
        paymentReference: {type: string, nullable: true}
        paidAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time, nullable: true}
        customer:
          type: object
          properties:
            publicId: {type: string, nullable: true}
            fullName: {type: string, nullable: true}
            phone: {type: string, nullable: true}
            email: {type: string, nullable: true}
        delivery: {type: object, additionalProperties: true}
        deliveryFeeNote: {type: string, nullable: true}
        createdByStaffId: {type: integer, nullable: true}
        items:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              lineType: {type: string, enum: [PRODUCT, BUNDLE, BUNDLE_EXTRA]}
              parentItemId: {type: integer, nullable: true}
              name: {type: string}
              size: {type: string, nullable: true}
              productCode: {type: string}
              imageRef: {type: string, nullable: true}
              bundleContents: {nullable: true}
              quantity: {type: integer}
              unitPriceMinor: {type: integer}
              lineTotalMinor: {type: integer}
              currentUnitPriceMinor: {type: integer, nullable: true, description: 'Detail responses: today''s price for this item, or null when it is no longer on sale.'}
        statusEvents:
          type: array
          items:
            type: object
            properties:
              fromStatus: {$ref: '#/components/schemas/OrderStatus'}
              toStatus: {$ref: '#/components/schemas/OrderStatus'}
              actorType: {type: string, enum: [SYSTEM, STAFF]}
              actorId: {type: integer, nullable: true}
              reason: {type: string, nullable: true}
              createdAt: {type: string, format: date-time, nullable: true}
        notes:
          type: array
          items: {$ref: '#/components/schemas/AdminOrderNote'}
        contentRevisions:
          type: array
          description: Detail responses only. Append-only history of item edits.
          items:
            type: object
            properties:
              id: {type: integer}
              staffId: {type: integer}
              staffName: {type: string}
              reason: {type: string}
              beforeItems: {type: array, items: {type: object, additionalProperties: true}}
              afterItems: {type: array, items: {type: object, additionalProperties: true}}
              beforeSubtotalMinor: {type: integer}
              afterSubtotalMinor: {type: integer}
              differenceMinor: {type: integer}
              settlementMethod: {type: string, enum: [NONE, CASH, MOMO, BANK, OTHER]}
              settlementNote: {type: string, nullable: true}
              createdAt: {type: string, format: date-time}
    AdminComplaintListItem:
      type: object
      required: [reference, topic, name, orderNumberEntered, status, assignedStaff, createdAt, updatedAt]
      properties:
        reference: {type: string}
        topic: {type: string, enum: [ORDER_PROBLEM, PRODUCT_QUESTION, OTHER]}
        name: {type: string}
        orderNumberEntered: {type: string, nullable: true}
        status: {type: string, enum: [NEW, IN_PROGRESS, RESOLVED]}
        assignedStaff: {type: object, nullable: true, properties: {id: {type: integer}, name: {type: string}}}
        createdAt: {type: string, format: date-time, nullable: true}
        updatedAt: {type: string, format: date-time, nullable: true}
    AdminComplaint:
      allOf:
        - {$ref: '#/components/schemas/AdminComplaintListItem'}
        - type: object
          required: [message, contactMethod, phone, email, resolvedAt, customer, order, events]
          properties:
            message: {type: string}
            contactMethod: {type: string, enum: [CALL, WHATSAPP, EMAIL]}
            phone: {type: string, nullable: true}
            email: {type: string, format: email, nullable: true}
            resolvedAt: {type: string, format: date-time, nullable: true}
            customer: {type: object, nullable: true, properties: {publicId: {type: string}, fullName: {type: string}}}
            order: {type: object, nullable: true, properties: {orderNumber: {type: string}, status: {type: string}}}
            events:
              type: array
              items:
                type: object
                required: [id, type, fromStatus, toStatus, body, staffId, staffName, createdAt]
                properties:
                  id: {type: integer}
                  type: {type: string, enum: [SUBMITTED, CLAIMED, NOTE, STATUS_CHANGED]}
                  fromStatus: {type: string, nullable: true}
                  toStatus: {type: string, nullable: true}
                  body: {type: string, nullable: true}
                  staffId: {type: integer, nullable: true}
                  staffName: {type: string, nullable: true}
                  createdAt: {type: string, format: date-time}
    AdminDashboard:
      type: object
      required: [date, timezone, period, startDate, endDate]
      properties:
        date: {type: string, format: date, description: Today's date in Africa/Accra.}
        timezone: {type: string, enum: [Africa/Accra]}
        period: {type: string, enum: [today, week, month, year, custom]}
        startDate: {type: string, format: date, description: Inclusive start date in Africa/Accra.}
        endDate: {type: string, format: date, description: Inclusive end date in Africa/Accra.}
        paidOrders: {type: integer, description: Non-cancelled/non-refunded orders paid in the selected range.}
        salesMinor: {type: integer, description: Total paid in pesewas for the selected range.}
        paidOrdersToday: {type: integer, description: Today's paid orders; retained for compatibility.}
        salesTodayMinor: {type: integer, description: Today's sales in pesewas; retained for compatibility.}
        currency: {type: string, enum: [GHS]}
        processingCount: {type: integer}
        readyForDispatchCount: {type: integer}
        dispatchedCount: {type: integer}
        openRefundRequests: {type: integer}
        reconciliationCount: {type: integer}
        refundReconciliationCount: {type: integer, description: 'Refund reconciliation items: refund.reconciliation_required audit rows plus COMPLETED requests whose order is not REFUNDED.'}
        failedNotificationCount: {type: integer, description: Notifications whose latest attempt is FAILED or EXHAUSTED.}
        newComplaints: {type: integer, description: NEW complaints; available with view-complaints.}
        complaintsWaiting: {type: integer, description: NEW complaints older than 24 hours; available with view-complaints.}
        range:
          type: object
          description: Available with view-sales-figures. Running dates end today; legacy top-level dates remain full calendar boundaries.
          required: [current, previous]
          properties:
            current: {$ref: '#/components/schemas/DashboardRangeMetrics'}
            previous:
              allOf: [{$ref: '#/components/schemas/DashboardRangeMetrics'}]
              nullable: true
              description: Comparison metrics; null without earlier payment history. Customer identities are omitted.
        attentionQueue:
          type: array
          maxItems: 40
          description: Live oldest rows, up to ten per kind. Order amounts require view-orders, customer names view-customers, refund rows view-refunds, and payment exceptions view-reconciliation.
          items: {$ref: '#/components/schemas/DashboardAttention'}
        attentionSummary:
          type: object
          description: Unbounded live counts; keys are omitted when the corresponding permission is absent.
          properties:
            staleCount: {type: integer}
            oldestChangedAt: {type: string, format: date-time, nullable: true}
            openRefundCount: {type: integer}
            unmatchedPaymentCount: {type: integer}
            mismatchCount: {type: integer}
            failedNotificationCount: {type: integer}
            refundReconciliationCount: {type: integer}
        checkoutOutcomes:
          type: object
          description: Selected elapsed period by checkout creation date. Amounts require view-sales-figures; unmatched/mismatch are live counts requiring view-reconciliation.
          properties:
            total: {type: integer}
            paid: {type: integer}
            failed: {type: integer}
            abandoned: {type: integer}
            successRatePercent: {type: integer}
            unmatchedPayment: {type: integer}
            mismatch: {type: integer}
            paidAmountMinor: {type: integer}
            failedAmountMinor: {type: integer}
            abandonedAmountMinor: {type: integer}
        fulfillment: {$ref: '#/components/schemas/DashboardFulfillment'}
        fulfillmentComparison: {$ref: '#/components/schemas/DashboardFulfillment'}
        refunds:
          type: object
          description: Refund counts require view-refunds; completed money also requires view-sales-figures and reconciliation counts view-reconciliation.
          properties:
            openRequests: {type: integer}
            completedCount: {type: integer}
            completedMinor: {type: integer}
            failedReconciliation: {type: integer}
        catalogue:
          type: object
          description: Retained paid orders excluding CANCELLED and REFUNDED. Variants aggregate by product; sets remain separate. Amounts and channels require view-sales-figures.
          properties:
            bestSellers:
              type: array
              maxItems: 4
              items: {$ref: '#/components/schemas/DashboardCatalogueItem'}
            bestSellersTotal: {type: integer}
            unsold:
              type: array
              maxItems: 20
              items: {$ref: '#/components/schemas/DashboardCatalogueItem'}
            unsoldTotal: {type: integer}
            sourceChannels:
              type: array
              items:
                type: object
                required: [source, count, salesMinor]
                properties:
                  source: {type: string, enum: [ONLINE, MANUAL]}
                  count: {type: integer}
                  salesMinor: {type: integer}
    DashboardRangeMetrics:
      type: object
      required: [startDate, endDate, netSalesMinor, receivedMinor, refundsMinor, refundCount, paidOrders, averageOrderValueMinor]
      properties:
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
        netSalesMinor: {type: integer, description: Cash received less refunds issued in the same dates; may be negative.}
        receivedMinor: {type: integer}
        refundsMinor: {type: integer}
        refundCount: {type: integer}
        paidOrders: {type: integer, description: Includes paid orders later refunded or cancelled.}
        averageOrderValueMinor: {type: integer}
        returningCustomerPercent: {type: integer}
        returningCustomerCount: {type: integer}
        customerCount: {type: integer}
        returningCustomers:
          type: array
          maxItems: 4
          description: Current range only; requires view-customers as well as view-sales-figures.
          items:
            type: object
            required: [publicId, name, orders, amountMinor, firstPurchaseDate]
            properties:
              publicId: {type: string}
              name: {type: string}
              orders: {type: integer}
              amountMinor: {type: integer}
              firstPurchaseDate: {type: string, format: date, nullable: true}
    DashboardAttention:
      type: object
      required: [id, kind, orderNumber, status, amountMinor, currency, changedAt, ageHours, stale, reason]
      properties:
        id: {type: integer}
        kind: {type: string, enum: [order, payment, mismatch, refund]}
        orderNumber: {type: string, nullable: true}
        status: {type: string}
        customerName: {type: string, nullable: true}
        customerPublicId: {type: string, nullable: true}
        amountMinor: {type: integer}
        currency: {type: string, enum: [GHS]}
        changedAt: {type: string, format: date-time}
        ageHours: {type: integer}
        stale: {type: boolean}
        reason: {type: string}
    DashboardFulfillment:
      type: object
      description: view-orders required. Live stage counts, with durations for orders whose delivery status event falls in the selected elapsed range.
      properties:
        processing: {type: integer}
        readyForDispatch: {type: integer}
        dispatched: {type: integer}
        deliveredCount: {type: integer}
        averageHoursToDelivered: {type: integer, nullable: true}
        averageHoursToDispatched: {type: integer, nullable: true}
    DashboardCatalogueItem:
      type: object
      required: [catalogueType, productId, bundleId, name]
      properties:
        catalogueType: {type: string, enum: [product, bundle]}
        productId: {type: integer, nullable: true}
        bundleId: {type: integer, nullable: true}
        name: {type: string}
        quantity: {type: integer, description: Best sellers only.}
        amountMinor: {type: integer, description: Best sellers only; omitted without view-sales-figures.}
    AdminCustomer:
      type: object
      description: List responses omit orders and notes.
      required: [publicId, fullName, phone, phoneE164, email, firstOrderAt, lastOrderAt, ordersCount, lifetimePaidMinor]
      properties:
        publicId: {type: string}
        fullName: {type: string}
        phone: {type: string}
        phoneE164: {type: string}
        email: {type: string, nullable: true}
        firstOrderAt: {type: string, format: date-time, nullable: true}
        lastOrderAt: {type: string, format: date-time, nullable: true}
        ordersCount: {type: integer}
        lifetimePaidMinor: {type: integer}
        orders:
          type: array
          items:
            type: object
            required: [orderNumber, status, source, totalPaidMinor, currency, paidAt, createdAt]
            properties:
              orderNumber: {type: string}
              status: {$ref: '#/components/schemas/OrderStatus'}
              source: {type: string, enum: [ONLINE, MANUAL]}
              totalPaidMinor: {type: integer}
              currency: {type: string}
              paidAt: {type: string, format: date-time, nullable: true}
              createdAt: {type: string, format: date-time, nullable: true}
        notes:
          type: array
          items: {$ref: '#/components/schemas/AdminOrderNote'}
        contentRevisions:
          type: array
          description: Detail responses only. Append-only history of item edits.
          items:
            type: object
            properties:
              id: {type: integer}
              staffId: {type: integer}
              staffName: {type: string}
              reason: {type: string}
              beforeItems: {type: array, items: {type: object, additionalProperties: true}}
              afterItems: {type: array, items: {type: object, additionalProperties: true}}
              beforeSubtotalMinor: {type: integer}
              afterSubtotalMinor: {type: integer}
              differenceMinor: {type: integer}
              settlementMethod: {type: string, enum: [NONE, CASH, MOMO, BANK, OTHER]}
              settlementNote: {type: string, nullable: true}
              createdAt: {type: string, format: date-time}
    AdminOrderResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/AdminOrder'}
  responses:
    AdminRefundOk:
      description: The refund request in its current state.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/AdminRefund'}
    Unauthenticated:
      description: Staff authentication is required.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The requested operation is forbidden.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource was not found.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The requested operation conflicts with the current state.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Request validation failed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          schema:
            type: integer
          description: Seconds before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
