      operationId: changeStaffPassword
      summary: Change own password and revoke other sessions
      description: Allowed during forced password change. New password must be 12–128 characters with upper/lower case, a digit, and a symbol. Session rotates; the original 12-hour deadline remains.
      security: [{sanctumSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword, newPasswordConfirmation]
              properties:
                currentPassword: {type: string, format: password}
                newPassword: {type: string, format: password, minLength: 12, maxLength: 128}
                newPasswordConfirmation: {type: string, format: password}
      responses:
        '200':
          description: Staff resource with mustChangePassword false.
          content:
