    get:
      operationId: adminListComplaints
      summary: List complaints (view-complaints)
      description: Open complaints first and oldest first by default. Filters can be combined; mine means assigned to the caller.
      security: [{sanctumSession: []}]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [NEW, IN_PROGRESS, RESOLVED]}}
        - {name: mine, in: query, schema: {type: boolean}}
        - {name: unassigned, in: query, schema: {type: boolean}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: perPage, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 15}}
      responses:
        '200':
          description: Complaint summaries and pagination metadata.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/AdminComplaintListItem'}}
                  meta: {$ref: '#/components/schemas/PaginationMeta'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/complaints/{reference}:
    parameters:
      - {name: reference, in: path, required: true, schema: {type: string, pattern: '^C-[0-9]{6,}$'}}
    get:
      operationId: adminShowComplaint
      summary: Read complaint and complete event history (view-complaints)
      security: [{sanctumSession: []}]
      responses:
        '200':
          description: Complaint detail with linked summaries and events in append order.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/AdminComplaint'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/admin/complaints/{reference}/claim:
    parameters:
      - {name: reference, in: path, required: true, schema: {type: string}}
    post:
      operationId: adminClaimComplaint
      summary: Claim or take over a complaint (handle-complaints)
      security: [{sanctumSession: []}]
      responses:
        '200': {description: Complaint after claim; claiming NEW moves it to IN_PROGRESS.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/complaints/{reference}/notes:
    parameters:
      - {name: reference, in: path, required: true, schema: {type: string}}
    post:
      operationId: adminAddComplaintNote
      summary: Append a complaint note (handle-complaints)
      security: [{sanctumSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string, minLength: 1, maxLength: 2000}
      responses:
        '200': {description: Complaint detail with the appended note event.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/complaints/{reference}/status:
    parameters:
      - {name: reference, in: path, required: true, schema: {type: string}}
    post:
      operationId: adminChangeComplaintStatus
      summary: Change or reopen complaint status (handle-complaints)
      security: [{sanctumSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toStatus]
              properties:
                toStatus: {type: string, enum: [IN_PROGRESS, RESOLVED]}
                note: {type: string, nullable: true, maxLength: 2000, description: Required for resolution and reopening.}
      responses:
        '200': {description: Complaint detail with the appended status event.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/dashboard:
    get:
      operationId: adminDashboard
      summary: Business overview and live operational attention
      description: >-
        Response sections are optional and appear only when the staff member has the matching permission: salesMinor and salesTodayMinor require view-sales-figures; paid-order and stage counts require view-orders; openRefundRequests requires view-refunds; reconciliation counts and failedNotificationCount require view-reconciliation; complaint counts require view-complaints.
        Calendar periods use Africa/Accra: today (default), week (Monday through Sunday), month, year, or custom.
        Custom requires both from and to as YYYY-MM-DD, with to >= from and neither date after today in Africa/Accra; dates are prohibited for other periods.
        startDate and endDate are inclusive; queries use half-open [start, midnight after end), converted to storage
        timezone. paidOrders and salesMinor count payments in that range excluding CANCELLED and REFUNDED orders.
        Legacy paidOrdersToday and salesTodayMinor always cover today, regardless of period; date is today's Accra date.
        Stage and attention counts remain current totals. openRefundRequests counts REQUESTED, UNDER_REVIEW, APPROVED and
        PROCESSING. `reconciliationCount` is the Phase 3 reconciliation set (MISMATCH or verified without an order).
        failedNotificationCount counts notifications whose latest attempt is FAILED or EXHAUSTED.
        Additive range.current analytics end today for running periods and use cash received minus processed refunds
        issued in those dates, independent of later order status. range.previous is an elapsed comparison or null
        without earlier payment history. Money analytics require view-sales-figures; returning-customer identities
        additionally require view-customers. attentionQueue is live and bounded to ten oldest rows per kind;
        attentionSummary counts all matching work. Payment exceptions require view-reconciliation.
      security: [{sanctumSession: []}]
      parameters:
        - {name: period, in: query, schema: {type: string, enum: [today, week, month, year, custom], default: today}}
        - {name: from, in: query, description: 'Required only for custom; inclusive start date in Africa/Accra.', schema: {type: string, format: date}}
        - {name: to, in: query, description: 'Required only for custom; inclusive end date on or after from.', schema: {type: string, format: date}}
      responses:
        '200':
          description: Dashboard summary.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/AdminDashboard'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/customers:
