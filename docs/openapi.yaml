openapi: 3.0.3
info:
  title: Vidorck Hair API
  version: 1.0.0
  description: >-
    Public catalogue and staff APIs for Vidorck Hair, including authentication, roles, audit, products, variants, bundles, and images. Amounts are integer GHS pesewas.
servers:
  - url: http://localhost:8000
    description: Local
  - url: https://staging-api.vidorckhair.com
    description: Staging
  - url: https://api.vidorckhair.com
    description: Production
paths:
  /up:
    get:
      operationId: healthCheck
      summary: Check application health
      responses:
        '200':
          description: Application is available (Laravel health response).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '500':
          description: Application health check failed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
  /sanctum/csrf-cookie:
    get:
      operationId: csrfCookie
      summary: Initialize Sanctum SPA CSRF cookies
      description: >-
        Call from the configured admin origin with credentials included before
        staff login. Submit the decoded XSRF-TOKEN cookie in X-XSRF-TOKEN on
        subsequent unsafe requests.
      responses:
        '204':
          description: CSRF and session cookies initialized.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              schema:
                type: string
              description: XSRF-TOKEN and session cookies (multiple headers).
  /api/v1/checkout:
    post:
      operationId: createCheckout
      summary: Validate a cart, create a payment attempt, and initialize Paystack
      description: >-
        Prices are resolved from the current public catalogue. Client-supplied price and amount fields are ignored.
        At most 100 cart lines are accepted. A matching expectedUnitPriceMinor may be supplied to reject stale prices.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CheckoutRequest'}
      responses:
        '201':
          description: Paystack authorization details.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckoutResponse'}
        '422':
          description: Invalid checkout input, unavailable line, stale price, or unsupported delivery area.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckoutError'}
        '503':
          description: Payment provider could not initialize the transaction.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: Checkout initialization rate limit exceeded (10 requests per minute per IP).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/checkout/{reference}:
    get:
      operationId: getCheckoutStatus
      summary: Poll a checkout payment attempt
      description: >-
        Returns only customer-safe payment status. Pending attempts older than 10 seconds are verified with
        Paystack at most once per 10 seconds. Expired attempts are verified before they are marked abandoned.
        Provider verification failures leave status pending. This endpoint is limited to 30 requests per minute per IP.
      parameters:
        - name: reference
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Current checkout status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckoutStatusResponse'}
        '404':
          description: No checkout attempt exists for the supplied reference.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: Checkout status rate limit exceeded (30 requests per minute per IP).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/checkout/{reference}/retry:
    post:
      operationId: retryCheckout
      summary: Retry a failed checkout payment
      description: >-
        Revalidates the saved customer, delivery, and cart snapshot against the active catalogue and current prices.
        Only final FAILED or ABANDONED attempts and expired PENDING attempts can be retried. Paystack is verified
        before a new initialization; provider states that are still in progress block the retry even after local
        expiry. Each attempt can have at most one immediate retry.
      parameters:
        - name: reference
          in: path
          required: true
          schema: {type: string}
      responses:
        '201':
          description: New Paystack authorization details.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckoutResponse'}
        '404':
          description: No checkout attempt exists for the supplied reference.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: The attempt is pending, paid, mismatched, or already retried.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: Saved checkout details, delivery area, product, or price are no longer valid.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckoutError'}
        '503':
          description: Provider verification or initialization is unavailable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: Checkout initialization rate limit exceeded (10 requests per minute per IP).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/orders/cancellation-requests:
    post:
      operationId: requestOrderCancellation
      summary: Request cancellation or refund before dispatch
      description: >-
        Verifies order number plus phone (normalised) and records one open request per order. Allowed only while
        the order is PAID, PROCESSING, or READY_FOR_DISPATCH. Does not change the order status or refund anything.
        Unknown orders, wrong phones, and malformed phones return the same generic 404. Rate limit: 5 per minute
        and 20 per hour per IP, plus 10 per hour per order number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderNumber, phone, reason]
              properties:
                orderNumber: {type: string, maxLength: 40}
                phone: {type: string, maxLength: 20}
                reason: {type: string, minLength: 5, maxLength: 1000}
      responses:
        '201':
          description: Request recorded.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status, requestedAt]
                    properties:
                      status: {type: string, enum: [REQUESTED]}
                      requestedAt: {type: string, format: date-time}
        '404':
          description: Generic not found (unknown order or phone mismatch).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Order is dispatched or closed (CANCELLATION_NOT_ALLOWED) or already has an open request (CANCELLATION_ALREADY_REQUESTED).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: Validation failed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/complaints:
    post:
      operationId: submitComplaint
      summary: Submit a support message
      description: >-
        Stores the message as a complaint and returns its reference. Rate limit: 3 per 10 minutes per IP.
        A filled hidden `website` field (honeypot) returns a normal acknowledgement without storing the submission.
        Control characters are rejected. A customer acknowledgement is sent on the selected channel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, topic, message, contactMethod]
              properties:
                name: {type: string, minLength: 2, maxLength: 100}
                topic: {type: string, enum: [ORDER_PROBLEM, PRODUCT_QUESTION, OTHER]}
                orderNumber: {type: string, nullable: true, maxLength: 100}
                message: {type: string, maxLength: 5000}
                contactMethod: {type: string, enum: [CALL, WHATSAPP, EMAIL]}
                phone: {type: string, nullable: true, maxLength: 20, description: 'Ghana phone number, required for CALL and WHATSAPP.'}
                email: {type: string, format: email, nullable: true, maxLength: 254, description: "Required for EMAIL."}
                website: {type: string, description: Honeypot. Must be left empty.}
      responses:
        '201':
          description: Complaint stored.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [reference, status]
                    properties:
                      reference: {type: string, example: C-000123}
                      status: {type: string, enum: [NEW]}
        '200':
          description: Honeypot acknowledgement; nothing was stored.
        '422':
          description: Validation failed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/orders/track:
    post:
      operationId: trackOrder
      summary: Track an order by order number and phone
      description: >-
        Order number and phone are normalised. Unknown orders, wrong phones, and malformed phones return the same
        generic 404 body. The response is customer-safe only: no notes, staff, reasons, payment references, tracking
        token, or courier details. Rate limit: 5 per minute and 20 per hour per IP, plus 10 per hour per order number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderNumber, phone]
              properties:
                orderNumber: {type: string, maxLength: 40}
                phone: {type: string, maxLength: 20}
      responses:
        '200':
          description: Customer-safe order view.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/CustomerOrder'}
        '404':
          description: Generic not found (unknown order or phone mismatch).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: Validation failed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/orders/confirmation/{trackingToken}:
    parameters:
      - {name: trackingToken, in: path, required: true, schema: {type: string}}
    get:
      operationId: getOrderConfirmation
      summary: Compact order success payload for the confirmation page
      description: The 32-character random tracking token is the capability; no phone is required. Rate limit 30 per minute per IP.
      responses:
        '200':
          description: Compact confirmation payload.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/OrderConfirmation'}
        '404':
          description: Unknown token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/webhooks/paystack:
    post:
      operationId: receivePaystackWebhook
      summary: Receive and queue a signed Paystack event
      description: >-
        Verifies the raw request body with HMAC-SHA512 using x-paystack-signature. Valid receipts are stored
        idempotently and queued for provider verification; the response does not imply that payment is confirmed.
        This endpoint does not use the staff session or CSRF middleware.
      parameters:
        - name: x-paystack-signature
          in: header
          required: true
          schema: {type: string, pattern: '^[a-fA-F0-9]{128}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaystackWebhook'}
      responses:
        '200':
          description: Signed event receipt stored or already received.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaystackWebhookResponse'}
        '400':
          description: Signed request body is malformed JSON.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: Signature is missing or invalid.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: Signed event is missing required event data.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/products:
    get:
      operationId: listPublicProducts
      summary: List publicly visible products
      description: >-
        Returns published products with an active variant whose category is active. Search is case- and
        diacritic-insensitive and treats percent and underscore as literal characters. Category and hair_type
        accept either a slug or a display name. Facet counts always describe the global publicly visible set,
        independent of the active query filters.
      parameters:
        - {name: q, in: query, description: Normalized product-name search, schema: {type: string, maxLength: 100}}
        - {name: category, in: query, description: Category slug or display name, schema: {type: string, maxLength: 120}}
        - {name: hair_type, in: query, description: Hair type slug or display name, schema: {type: string, maxLength: 120}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
      responses:
        '200':
          description: Public-safe product resources and global facets, 15 per page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicProductPageResponse'}
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/products/{slug}:
    parameters:
      - {name: slug, in: path, required: true, schema: {type: string}}
    get:
      operationId: showPublicProduct
      summary: Read a publicly visible product
      responses:
        '200':
          description: Public-safe product resource.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicProductResponse'}
        '301':
          description: Permanent slug redirect. The target is returned only if it is publicly visible.
          headers:
            Location:
              schema: {type: string}
              example: /api/v1/products/new-slug
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SlugRedirectResponse'}
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/bundles:
    get:
      operationId: listPublicBundles
      summary: List publicly visible bundles
      description: Returns published bundles with at least one item, where every item references an active variant of a publicly visible product.
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
      responses:
        '200':
          description: Public-safe bundle resources, 15 per page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicBundlePageResponse'}
  /api/v1/bundles/{slug}:
    parameters:
      - {name: slug, in: path, required: true, schema: {type: string}}
    get:
      operationId: showPublicBundle
      summary: Read a publicly visible bundle
      responses:
        '200':
          description: Public-safe bundle resource with public product and variant resources for each item.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicBundleResponse'}
        '301':
          description: Permanent slug redirect. The target is returned only if it is publicly visible.
          headers:
            Location:
              schema: {type: string}
              example: /api/v1/bundles/new-slug
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SlugRedirectResponse'}
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/categories:
    get:
      operationId: listPublicCategories
      summary: List active categories
      responses:
        '200':
          description: Active category resources in display order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CategoryListResponse'}
  /api/v1/delivery-areas:
    get:
      operationId: listPublicDeliveryAreas
      summary: List active delivery areas
      responses:
        '200':
          description: Active delivery areas in display order, with storefront-safe fields.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryAreaListResponse'}
  /api/v1/hair-types:
    get:
      operationId: listPublicHairTypes
      summary: List hair types
      responses:
        '200':
          description: Hair type resources in display order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HairTypeListResponse'}
  /api/v1/admin/products:
    get:
      operationId: adminListProducts
      summary: List catalogue products (catalogue readers)
      security: [{sanctumSession: []}]
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: perPage, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 15}}
        - {name: q, in: query, schema: {type: string, maxLength: 255}}
        - {name: categoryId, in: query, schema: {type: integer, minimum: 1}}
        - {name: isPublished, in: query, schema: {type: boolean}}
      responses:
        '200':
          description: Admin product resources with pagination metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminProductPageResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
    post:
      operationId: adminCreateProduct
      summary: Create a catalogue product (Admin only)
      security: [{sanctumSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminProductCreate'}
      responses:
        '201':
          description: Created admin product resource.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminProductResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '419': {description: Missing or invalid CSRF token.}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/products/{product}:
    parameters:
      - {name: product, in: path, required: true, schema: {type: integer, minimum: 1}}
    get:
      operationId: adminShowProduct
      summary: Read a product and its variants (catalogue readers)
      security: [{sanctumSession: []}]
      responses:
        '200':
          description: Admin product resource, including source prices and internal IDs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminProductResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: adminUpdateProduct
      summary: Update product details (Admin only)
      security: [{sanctumSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminProductUpdate'}
      responses:
        '200':
          description: Updated admin product resource.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminProductResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {description: Missing or invalid CSRF token.}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/products/{product}/publish:
    parameters:
      - {name: product, in: path, required: true, schema: {type: integer, minimum: 1}}
    post:
      operationId: adminPublishProduct
      summary: Publish a product (catalogue publisher)
      security: [{sanctumSession: []}]
      responses:
        '200':
          description: Updated admin product resource.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminProductResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {description: Missing or invalid CSRF token.}
  /api/v1/admin/products/{product}/unpublish:
    parameters:
      - {name: product, in: path, required: true, schema: {type: integer, minimum: 1}}
    post:
      operationId: adminUnpublishProduct
      summary: Unpublish a product (catalogue publisher)
      security: [{sanctumSession: []}]
      responses:
        '200':
          description: Updated admin product resource.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminProductResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {description: Missing or invalid CSRF token.}
  /api/v1/admin/products/{product}/variants:
    parameters:
      - {name: product, in: path, required: true, schema: {type: integer, minimum: 1}}
    get:
      operationId: adminListProductVariants
      summary: List a product's variants (catalogue readers)
      security: [{sanctumSession: []}]
      responses:
        '200':
          description: Variant resources including source prices and internal IDs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminVariantListResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: adminCreateProductVariant
      summary: Add a variant to a product (Admin only)
      security: [{sanctumSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminVariantCreate'}
      responses:
        '201':
          description: Created variant resource.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminVariantResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {description: Missing or invalid CSRF token.}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/products/{product}/variants/{variant}:
    parameters:
      - {name: product, in: path, required: true, schema: {type: integer, minimum: 1}}
      - {name: variant, in: path, required: true, schema: {type: integer, minimum: 1}}
    patch:
      operationId: adminUpdateProductVariant
      summary: Update a product variant (Admin only)
      security: [{sanctumSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminVariantUpdate'}
      responses:
        '200':
          description: Updated variant resource.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminVariantResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {description: Missing or invalid CSRF token.}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/products/{product}/image:
    parameters:
      - {name: product, in: path, required: true, schema: {type: integer, minimum: 1}}
    post:
      operationId: adminUploadProductImage
      summary: Upload or replace a product image (image manager)
      description: Accepts JPEG, PNG, or WebP up to 8 MiB and 6000 pixels per edge. The server strips metadata and creates WebP renditions.
      security: [{sanctumSession: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/ImageUpload'}
      responses:
        '201':
          description: Uploaded image resource.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminImageResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {description: Missing or invalid CSRF token.}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/categories:
    get:
      operationId: adminListCategories
      summary: List categories with product counts (catalogue readers)
      security: [{sanctumSession: []}]
      responses:
        '200':
          description: Category resources including inactive categories.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminCategoryListResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: adminCreateCategory
      summary: Create a category (Admin only)
      security: [{sanctumSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminCategoryCreate'}
      responses:
        '201':
          description: Created category resource.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminCategoryResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '419': {description: Missing or invalid CSRF token.}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/categories/{category}:
    parameters:
      - {name: category, in: path, required: true, schema: {type: integer, minimum: 1}}
    patch:
      operationId: adminUpdateCategory
      summary: Update a category (Admin only)
      security: [{sanctumSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminCategoryUpdate'}
      responses:
        '200':
          description: Updated category resource.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminCategoryResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
