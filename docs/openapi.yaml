      security: [{sanctumSession: []}]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [REQUESTED, UNDER_REVIEW, APPROVED, REJECTED, PROCESSING, COMPLETED, FAILED]}}
        - {name: needsReconciliation, in: query, schema: {type: boolean}}
        - {name: open, in: query, description: 'true lists REQUESTED, UNDER_REVIEW, APPROVED and PROCESSING requests (the dashboard openRefundRequests set).', schema: {type: boolean}}
        - {name: orderNumber, in: query, description: 'Exact order number, case-insensitive.', schema: {type: string, maxLength: 40}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
