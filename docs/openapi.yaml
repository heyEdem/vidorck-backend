              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/AdminOrderNote'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/refunds/{id}/decision:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    post:
      operationId: adminDecideRefund
      summary: Approve or reject a refund request (ADMIN only)
      description: >-
        website-spec section 16.2. The decision and its order check are committed atomically (409 REFUND_NOT_DECIDABLE if
        already decided; 409 REFUND_ORDER_NOT_REFUNDABLE if approving after dispatch; rejection is always possible).
        REJECT requires `reason`. APPROVE on an ONLINE order then calls Paystack `POST /refund` (no automatic retry) and
        moves the request to PROCESSING; a definitive provider refusal records a FAILED transaction and sets the request
        FAILED (502 REFUND_REJECTED_BY_PROVIDER); an unknown outcome (timeout/5xx) leaves it APPROVED (503
        REFUND_PROVIDER_UNAVAILABLE; do not re-submit, the webhook resolves it). APPROVE on a MANUAL order stays APPROVED
        until manual completion. The order is never marked REFUNDED here; only provider or manual confirmation does that.
        While APPROVED/PROCESSING, moving the order to DISPATCHED returns 409 REFUND_IN_PROGRESS.
      security: [{sanctumSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [APPROVE, REJECT]}
                reason: {type: string, minLength: 3, maxLength: 1000, nullable: true, description: Required for REJECT.}
      responses:
        '200': {$ref: '#/components/responses/AdminRefundOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '502': {description: Provider refused the refund (REFUND_REJECTED_BY_PROVIDER); request is FAILED., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: Provider outcome unknown (REFUND_PROVIDER_UNAVAILABLE); request stays APPROVED., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/admin/refunds/{id}/retry:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    post:
      operationId: adminRetryRefund
      summary: Re-attempt the Paystack refund for an APPROVED online request (ADMIN only)
      description: >-
        Valid only while the request is APPROVED, the order is ONLINE and still pre-dispatch, and no refund transaction
        row exists (409 REFUND_NOT_RETRYABLE otherwise, including while another attempt is outstanding). The amount is
        always the order total. Before any POST the retry lists existing Paystack refunds for the charge (GET /refund): a refund that is not failed is adopted (one PENDING transaction row, request PROCESSING, no POST); an unreachable or unmatchable lookup returns 503 and sends nothing. Same outcomes as the decision (200 PROCESSING, 502 REFUND_REJECTED_BY_PROVIDER with the
        request FAILED, 503 REFUND_PROVIDER_UNAVAILABLE with the request still APPROVED).
      security: [{sanctumSession: []}]
      responses:
        '200': {$ref: '#/components/responses/AdminRefundOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '502': {description: Provider refused the refund (REFUND_REJECTED_BY_PROVIDER)., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: Provider outcome unknown (REFUND_PROVIDER_UNAVAILABLE)., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/admin/refunds/{id}/manual-completion:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    post:
      operationId: adminCompleteManualRefund
      summary: Record a manual refund and move the order to REFUNDED (ADMIN only)
      description: >-
        MANUAL orders only (409 REFUND_NOT_MANUAL otherwise); the request must be APPROVED. `amountMinor` must equal the
        order total (422 AMOUNT_MISMATCH; partial refunds are out of scope). A reference already used by another refund
        returns 409 DUPLICATE_REFUND_REFERENCE. Replaying the same completion is idempotent (200).
      security: [{sanctumSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, reference, amountMinor]
              properties:
                method: {type: string, enum: [MOMO, CARD, CASH_OR_OTHER]}
                reference: {type: string, minLength: 3, maxLength: 100}
                amountMinor: {type: integer, minimum: 1}
      responses:
        '200': {$ref: '#/components/responses/AdminRefundOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/orders:
    get:
      operationId: adminListOrders
      summary: List orders (both roles)
      description: Newest first. `from`/`to` filter createdAt; a date-only `to` includes that whole day. `search` matches order number, customer name, and phone.
      security: [{sanctumSession: []}]
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/OrderStatus'}}
        - {name: source, in: query, schema: {type: string, enum: [ONLINE, MANUAL]}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: search, in: query, schema: {type: string, maxLength: 100}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: perPage, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 15}}
      responses:
        '200':
          description: Admin order summaries with pagination metadata.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/AdminOrder'}
                  meta: {$ref: '#/components/schemas/PaginationMeta'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/orders/manual:
    post:
      operationId: adminCreateManualOrder
      summary: Create an already-paid manual order (both roles)
      description: >-
        website-spec section 15. Payment was received outside checkout; the order enters at PAID with source MANUAL and
        createdByStaffId set, and appends an initial status event and an audit row. Items are priced from the current
        catalogue as snapshots; `amountPaidMinor` must equal that total (422 AMOUNT_MISMATCH). `confirm` must be the
        boolean true. A `status` other than PAID is rejected (422). A payment reference already used by any order
        (online or manual, compared case-insensitively) returns 409 DUPLICATE_PAYMENT_REFERENCE. Area may be any text so
        special-arrangement deliveries can be recorded; text matching a delivery area name (case-insensitive, trimmed) is stored under the canonical name. Dispatches OrderPaid after commit like online orders.
      security: [{sanctumSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm, fullName, phone, region, area, address, paymentMethod, paymentReference, amountPaidMinor, items]
              properties:
                confirm: {type: boolean, enum: [true]}
                status: {type: string, enum: [PAID]}
                fullName: {type: string, minLength: 2, maxLength: 100}
                phone: {type: string, pattern: '^(?:\\+233|0)[235][0-9]{8}$'}
                email: {type: string, format: email, nullable: true}
                region: {type: string, minLength: 2, maxLength: 80}
                area: {type: string, minLength: 2, maxLength: 120}
                address: {type: string, minLength: 5, maxLength: 200}
                landmark: {type: string, nullable: true, minLength: 2, maxLength: 160}
                ghanaPostGps: {type: string, nullable: true}
                specialArrangement: {type: boolean, default: false}
                paymentMethod: {type: string, enum: [MOMO, CARD, CASH_OR_OTHER]}
                paymentReference: {type: string, minLength: 3, maxLength: 100}
                amountPaidMinor: {type: integer, minimum: 1}
                note: {type: string, nullable: true, maxLength: 2000}
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [slug, productCode, quantity]
                    properties:
                      slug: {type: string}
                      productCode: {type: string}
                      quantity: {type: integer, minimum: 1, maximum: 20}
                      lineId: {type: string, nullable: true}
                      parentLineId: {type: string, nullable: true}
                      expectedUnitPriceMinor: {type: integer, minimum: 0}
      responses:
        '201':
          description: Created order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminOrderResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '419': {description: Missing or invalid CSRF token.}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/orders/{number}:
    parameters:
      - {name: number, in: path, required: true, schema: {type: string}}
    get:
      operationId: adminShowOrder
      summary: Read an order with items, status history, and notes (both roles)
      security: [{sanctumSession: []}]
      responses:
        '200':
          description: Full admin order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminOrderResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/admin/orders/{number}/transitions:
    parameters:
      - {name: number, in: path, required: true, schema: {type: string}}
    post:
      operationId: adminTransitionOrder
      summary: Move an order to its next status (both roles); one-step-back corrections are Admin-only
      description: >-
        Goes through OrderStateMachine. CANCELLED and REFUNDED are reachable only through the refund flow. A correction
        requires a reason and the ADMIN role (403 for Sales/Orders). Invalid moves return 409 INVALID_ORDER_TRANSITION
        with `errors.allowedStatuses`.
      security: [{sanctumSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toStatus]
              properties:
                toStatus: {$ref: '#/components/schemas/OrderStatus'}
                reason: {type: string, nullable: true, maxLength: 500}
      responses:
        '200':
          description: Updated order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminOrderResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '419': {description: Missing or invalid CSRF token.}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/orders/{number}/notes:
    parameters:
      - {name: number, in: path, required: true, schema: {type: string}}
    post:
      operationId: adminAddOrderNote
      summary: Append an internal order note (both roles)
      description: Notes are append-only; there is no edit or delete.
      security: [{sanctumSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string, minLength: 1, maxLength: 2000}
      responses:
        '201':
          description: Created note.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/AdminOrderNote'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {description: Missing or invalid CSRF token.}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/orders/{number}/delivery:
    parameters:
      - {name: number, in: path, required: true, schema: {type: string}}
    patch:
      operationId: adminUpdateOrderDelivery
      summary: Correct delivery details (Admin only, reason required)
      description: Changes only the delivery snapshot; never the order status. Audited with before and after values and the reason. `area` is free text; text matching an existing delivery area name (case-insensitive, trimmed) is stored under the canonical name, anything else as typed.
      security: [{sanctumSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                region: {type: string, minLength: 2, maxLength: 80}
                area: {type: string, minLength: 2, maxLength: 120}
                address: {type: string, minLength: 5, maxLength: 200}
                landmark: {type: string, minLength: 2, maxLength: 160}
                ghanaPostGps: {type: string, pattern: '^[A-Z]{2}-[0-9]{3,4}-[0-9]{4}$'}
                reason: {type: string, minLength: 5, maxLength: 500}
      responses:
        '200':
          description: Updated order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminOrderResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {description: Missing or invalid CSRF token.}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/orders/{number}/contents:
    parameters:
      - {name: number, in: path, required: true, schema: {type: string}}
    patch:
      operationId: adminUpdateOrderContents
      summary: Change a Paid or Processing order's items (Admin only, settled offline)
      description: >-
        Replaces the order's items with the complete list sent. Lines kept by `itemId` with an unchanged quantity keep
        their purchase-time price and snapshots; lines with a changed quantity and new lines (`slug` + `productCode`) are
        priced from the current catalogue and must still be on sale. `totalPaidMinor` never changes.
        Blocked while a refund request is open. When the items subtotal changes, `settlement.method` must not be NONE and
        `settlement.note` is required. Appends an immutable content revision and an audit entry.
      security: [{sanctumSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, reason, settlement, basedOnRevision]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [quantity]
                    properties:
                      itemId: {type: integer, description: 'An existing line of this order. An unchanged quantity keeps its paid price; a changed quantity is repriced from the catalogue.'}
                      slug: {type: string, maxLength: 160}
                      productCode: {type: string, maxLength: 80}
                      expectedUnitPriceMinor: {type: integer, minimum: 0}
                      quantity: {type: integer, minimum: 1, maximum: 20}
                reason: {type: string, minLength: 5, maxLength: 500}
                settlement:
                  type: object
                  required: [method]
                  properties:
                    method: {type: string, enum: [NONE, CASH, MOMO, BANK, OTHER]}
                    note: {type: string, nullable: true, maxLength: 500}
                basedOnRevision: {type: integer, minimum: 0, description: 'Number of content revisions the client saw; a mismatch is 409 ORDER_CONTENTS_CHANGED.'}
      responses:
        '200':
          description: Updated order with items and contentRevisions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminOrderResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '419': {description: Missing or invalid CSRF token.}
        '422': {$ref: '#/components/responses/ValidationError'}
