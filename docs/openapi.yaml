        - {name: perPage, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 15}}
      responses:
        '200':
          description: Staff resources with meta.page, meta.perPage and meta.total.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Staff'}
                  meta: {$ref: '#/components/schemas/PaginationMeta'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      operationId: createStaff
      summary: Create a staff account (Admin only)
      description: Generates a temporary password, returned once, and requires a password change at login. Responses are never cacheable.
      security: [{sanctumSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role]
              properties:
                name: {type: string, maxLength: 255}
                email: {type: string, format: email, maxLength: 255}
                role: {type: string, enum: [ADMIN, SALES_ORDERS, CUSTOMER_SERVICE]}
      responses:
        '201':
          description: Staff resource in data and one-time temporaryPassword at the top level.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemporaryStaffResponse'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '419':
          description: Missing or invalid CSRF token.
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/staff/{staff}:
    parameters:
      - {name: staff, in: path, required: true, schema: {type: integer, minimum: 1}}
    patch:
      operationId: updateStaff
      summary: Change staff role or active state (Admin only)
      description: Revokes every session on change. Self-disable, self-demotion and removing the last active Admin are rejected.
      security: [{sanctumSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                role: {type: string, enum: [ADMIN, SALES_ORDERS, CUSTOMER_SERVICE]}
                isActive: {type: boolean}
      responses:
        '200':
          description: Updated staff resource.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffResponse'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '419':
          description: Missing or invalid CSRF token.
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/staff/{staff}/reset-password:
    parameters:
      - {name: staff, in: path, required: true, schema: {type: integer, minimum: 1}}
    post:
      operationId: resetStaffPassword
      summary: Reset another staff account password (Admin only)
      description: Returns a generated temporaryPassword once, forces password change, and revokes all sessions. Five resets per minute per actor/IP. Use auth/password for your own account.
      security: [{sanctumSession: []}]
      responses:
        '200':
          description: Staff resource in data and one-time temporaryPassword at the top level; Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemporaryStaffResponse'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '419':
          description: Missing or invalid CSRF token.
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/admin/audit-logs:
    get:
      operationId: listAuditLogs
      summary: Read append-only redacted audit events (Admin only)
      security: [{sanctumSession: []}]
      parameters:
        - {name: actorId, in: query, schema: {type: integer, minimum: 1}}
        - {name: action, in: query, schema: {type: string}}
        - {name: targetType, in: query, schema: {type: string}}
        - {name: targetId, in: query, schema: {type: string}}
        - {name: from, in: query, description: Inclusive UTC or offset timestamp, schema: {type: string, format: date-time}}
        - {name: to, in: query, description: Inclusive UTC or offset timestamp; a YYYY-MM-DD date includes the entire UTC day, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: perPage, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 15}}
      responses:
        '200':
          description: Audit resources with meta.page, meta.perPage and meta.total; newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/AuditLog'}
                  meta: {$ref: '#/components/schemas/PaginationMeta'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  headers:
    RequestId:
      description: Supplied safe request identifier or a generated UUID.
      schema:
        type: string
        maxLength: 128
  securitySchemes:
    sanctumSession:
      type: apiKey
      in: cookie
      name: vhi_session
      description: Stateful staff SPA session; unsafe requests also need X-XSRF-TOKEN.
  schemas:
    PaystackWebhook:
      type: object
      required: [event, data]
      properties:
        event: {type: string, minLength: 1, example: charge.success}
        data:
          type: object
          description: Paystack event data. The receipt retains only allowlisted payment fields.
          properties:
            id: {oneOf: [{type: integer}, {type: string}]}
            reference: {type: string, description: Required for charge.success}
            amount: {oneOf: [{type: integer}, {type: string}]}
            currency: {type: string}
            status: {type: string}
            channel: {type: string}
            paid_at: {type: string}
            metadata:
              oneOf:
                - type: object
                  properties:
                    attemptId: {type: string}
                - type: string
      additionalProperties: true
    PaystackWebhookResponse:
      type: object
      required: [received]
      properties:
        received: {type: boolean, enum: [true]}
    CheckoutRequest:
      type: object
      required: [fullName, phone, email, region, area, address, landmark, ghanaPostGps, policyAccepted, items]
      properties:
        fullName: {type: string, minLength: 2, maxLength: 100}
        phone: {type: string, pattern: '^(?:\+233|0)[235][0-9]{8}$'}
        email: {type: string, format: email}
        region: {type: string, minLength: 2, maxLength: 80}
        area: {type: string, minLength: 2}
        address: {type: string, minLength: 5, maxLength: 200}
        landmark: {type: string, minLength: 2, maxLength: 160}
        ghanaPostGps: {type: string, pattern: '^[A-Z]{2}-[0-9]{3,4}-[0-9]{4}$'}
        policyAccepted: {type: boolean, enum: [true]}
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [slug, productCode, quantity]
            properties:
              slug: {type: string}
              productCode: {type: string}
              quantity: {type: integer, minimum: 1, maximum: 20}
              lineId: {type: string, maxLength: 40, nullable: true}
              parentLineId: {type: string, maxLength: 40, nullable: true}
              expectedUnitPriceMinor: {type: integer, minimum: 0}
    CheckoutResponse:
      type: object
      required: [authorizationUrl, reference]
      properties:
        authorizationUrl: {type: string, format: uri}
        reference: {type: string}
    CheckoutStatusResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [PENDING, SUCCEEDED, FAILED]}
        orderNumber: {type: string}
        trackingToken: {type: string}
        retryable: {type: boolean}
    CheckoutError:
      type: object
      required: [message, code, errors]
      properties:
        message: {type: string}
        code: {type: string, enum: [VALIDATION_ERROR, CHECKOUT_ITEMS_CHANGED]}
        errors: {type: object, additionalProperties: {type: array, items: {type: string}}}
        issues:
          type: array
          items:
            type: object
            required: [index, reason]
            properties:
              index: {type: integer}
              lineId: {type: string, nullable: true}
              reason: {type: string, enum: [ITEM_UNAVAILABLE, PRICE_CHANGED]}
              priceMinor: {type: integer, minimum: 0}
    Staff:
      type: object
      required: [id, name, email, role, permissions, isActive, mustChangePassword, lastLoginAt, lastLoginIp, createdAt]
      properties:
        id: {type: integer, minimum: 1}
        name: {type: string}
        email: {type: string, format: email}
        role: {type: string, enum: [ADMIN, SALES_ORDERS, CUSTOMER_SERVICE]}
        permissions:
          type: array
          description: Effective permission values for this staff member; authorization is based on these values.
          items: {type: string, enum: [view-dashboard, view-sales-figures, view-orders, update-order-status, add-order-notes, create-manual-orders, edit-order-delivery, edit-order-contents, view-refunds, add-refund-notes, decide-refunds, process-refunds, view-customers, add-customer-notes, view-catalogue, manage-catalogue, publish-catalogue, manage-images, view-complaints, handle-complaints, view-reconciliation, manage-staff, view-audit, change-own-password]}
        isActive: {type: boolean}
        mustChangePassword: {type: boolean}
